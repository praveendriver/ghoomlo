# Yatra travel-agent influencer watchlist
#
# Hand-curated. The corpus_builder.py reads this and fetches recent uploads/posts
# from each entry. Add/remove entries here; first run resolves channel_ids and
# caches them under .workspace/.influencer-cache/channels.json.
#
# region_focus values are free-form labels used by the scoring step.
# veg_friendly_signal=true means past content has shown veg/Indian-food preference.

youtube:
  # India / Asia lens — top priority for veg + family signal
  - handle: "@tanyakhanijow"
    region_focus: ["India", "Asia", "Europe", "global"]
    veg_friendly_signal: true
    notes: "Hindi/English; family vibe, vegetarian-aware, strong with Asia + Europe"
  - handle: "@Visa2explore"
    region_focus: ["India", "Asia"]
    veg_friendly_signal: true
    notes: "Hindi; deeply Indian-traveller perspective, food/transport heavy"
