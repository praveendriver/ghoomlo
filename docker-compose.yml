# Local development database. Not for production use.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ghoomlo
      POSTGRES_PASSWORD: ghoomlo
      POSTGRES_DB: ghoomlo
    ports:
      - "5432:5432"
    volumes:
      - ghoomlo-pg:/var/lib/postgresql/data
      - ./web/scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
volumes:
  ghoomlo-pg:
